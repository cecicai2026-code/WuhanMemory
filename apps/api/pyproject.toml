[project]
name = "wuhanmemory-api"
version = "0.1.0"
description = "FastAPI backend for WuhanMemory"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.118.0",
  "httpx>=0.28.0",
  "pillow>=11.0.0",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.12.0",
  "uvicorn[standard]>=0.38.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=1.2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# async 的测试函数不用一个个加 @pytest.mark.asyncio
asyncio_mode = "auto"
