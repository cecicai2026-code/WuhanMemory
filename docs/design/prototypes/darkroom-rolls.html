<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* 示例清单：只用来演示"胶卷很长"，正式的景点由 Cecilia 确定 */
const SPOTS = ['黄鹤楼', '户部巷', '昙华林', '武昌起义纪念馆', '湖北省博物馆', '东湖', '武汉大学', '楚河汉街', '武汉长江大桥',
  '晴川阁', '古琴台', '归元寺', '汉口江滩', '江汉关', '江汉路', '黎黄陂路', '古德寺', '吉庆街'];
const N = SPOTS.length, G = 5, GROUPS = Math.ceil(N / G);
const pad = n => String(n).padStart(2, '0');
document.getElementById('count').textContent = `1 卷 · ${N} 格`;

/* ---------- 画面颗粒 ---------- */
{ const c = document.getElementById('grain'), g = c.getContext('2d'), d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); c.style.width = '200%'; c.style.height = '200%'; c.style.imageRendering = 'pixelated'; }

/* ---------- 渲染器和镜头 ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070504);
scene.fog = new THREE.Fog(0x070504, 26, 50);
/* 环境反射：让黄铜和漆面有真实的反光 */
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.1;

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 120);
const camZ = () => Math.max(21.5, 21.5 * (1.7 / (innerWidth / innerHeight)));
const CAM = new THREE.Vector3(0.2, 4.1, camZ()), LOOK = new THREE.Vector3(0.2, 2.75, 0);
const camPos = CAM.clone(), camLook = LOOK.clone(), lookNow = LOOK.clone();
camera.position.copy(CAM);

/* ---------- 灯 ---------- */
scene.add(new THREE.HemisphereLight(0xffb48a, 0x1a0806, 0.1));
const lamp = new THREE.SpotLight(0xffd6a0, 7.4, 0, 0.66, 0.9, 0);
lamp.position.set(-3, 10, 10);
lamp.target.position.set(0.4, 1.4, 0);
lamp.castShadow = true;
lamp.shadow.mapSize.set(4096, 4096);
lamp.shadow.bias = -0.00025; lamp.shadow.normalBias = 0.02; lamp.shadow.radius = 8;
scene.add(lamp, lamp.target);
const safelight = new THREE.PointLight(0xff3b1e, 1.0, 0, 0); safelight.position.set(11, 4.5, 4); scene.add(safelight);
const rim = new THREE.PointLight(0xffc890, 0.3, 0, 0); rim.position.set(-9, 5, -2); scene.add(rim);

/* ---------- 贴图：都用画布现画 ---------- */
function tex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function grainLines(g, w, h, dark, light, n) {
  for (let i = 0; i < n; i++) {
    const y = rnd() * h, len = 200 + rnd() * 1100, x = rnd() * w - 300;
    g.strokeStyle = rnd() > 0.45 ? dark(rnd()) : light(rnd());
    g.lineWidth = 0.5 + rnd() * 2.4;
    g.beginPath(); g.moveTo(x, y);
    g.bezierCurveTo(x + len * 0.3, y + (rnd() - 0.5) * 10, x + len * 0.6, y + (rnd() - 0.5) * 10, x + len, y + (rnd() - 0.5) * 8);
    g.stroke();
  }
}
seed = 7;
const woodTex = tex(2048, 2048, (g, w, h) => {
  g.fillStyle = '#6a2015'; g.fillRect(0, 0, w, h);
  for (let p = 0; p < 6; p++) { g.fillStyle = `rgba(${p % 2 ? 40 : 120},${p % 2 ? 8 : 40},${p % 2 ? 4 : 24},.10)`; g.fillRect(0, (h / 6) * p, w, h / 6); }
  grainLines(g, w, h, a => `rgba(20,4,2,${0.05 + a * 0.16})`, a => `rgba(214,96,60,${0.02 + a * 0.07})`, 5200);
  for (let k = 0; k < 14; k++) {              /* 木节 */
    const x = rnd() * w, y = rnd() * h, r = 14 + rnd() * 30;
    for (let q = 0; q < 7; q++) { g.strokeStyle = `rgba(18,4,2,${0.10 + q * 0.02})`; g.lineWidth = 1.2; g.beginPath(); g.ellipse(x, y, r * (1 + q * 0.5), r * 0.32 * (1 + q * 0.45), 0, 0, 7); g.stroke(); }
  }
  for (let p = 1; p < 6; p++) { g.fillStyle = 'rgba(10,2,1,.7)'; g.fillRect(0, (h / 6) * p - 1, w, 3); g.fillStyle = 'rgba(255,150,110,.08)'; g.fillRect(0, (h / 6) * p + 2, w, 1); }
});
seed = 7;
const woodBump = tex(2048, 2048, (g, w, h) => {
  g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
  grainLines(g, w, h, a => `rgba(0,0,0,${0.10 + a * 0.25})`, a => `rgba(255,255,255,${0.05 + a * 0.12})`, 5200);
  for (let p = 1; p < 6; p++) { g.fillStyle = '#000'; g.fillRect(0, (h / 6) * p - 1, w, 4); }
}, false);
for (const t of [woodTex, woodBump]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2.4, 2.4); }

const brushed = tex(512, 512, (g, w, h) => {      /* 拉丝金属的粗糙度 */
  g.fillStyle = '#6a6a6a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 3000; i++) { const v = rnd() > .5 ? 255 : 0; g.fillStyle = `rgba(${v},${v},${v},.06)`; g.fillRect(0, rnd() * h, w, 1); }
}, false);
brushed.wrapS = brushed.wrapT = THREE.RepeatWrapping;

/* 示意照片：渐变天空 + 剪影 + 胶片颗粒。正式版换成真实照片 */
const PAL = [
  ['#1c2a4a', '#e8a35a', '#f6d79a'], ['#2a1830', '#d9603c', '#f2b05e'], ['#16323c', '#7fb7b0', '#f1e2b8'],
  ['#0b1024', '#31406e', '#c98b5a'], ['#243a2c', '#9cc0a0', '#f3e7c4'], ['#3a2418', '#c98a4a', '#f4dfae'],
  ['#2b2140', '#b0688e', '#f0c79a'], ['#10242e', '#4f7f8c', '#e6d6a8'],
];
function photo(i) {
  return tex(640, 640, (g, w, h) => {
    const [a, b, c] = PAL[i % PAL.length];
    const sky = g.createLinearGradient(0, 0, 0, h * 0.72);
    sky.addColorStop(0, a); sky.addColorStop(0.7, b); sky.addColorStop(1, c);
    g.fillStyle = sky; g.fillRect(0, 0, w, h);
    seed = 100 + i * 31;
    for (let k = 0; k < 5; k++) {              /* 云 */
      const cx = rnd() * w, cy = h * (0.12 + rnd() * 0.3), cw = 90 + rnd() * 160;
      const cg = g.createRadialGradient(cx, cy, 0, cx, cy, cw); cg.addColorStop(0, 'rgba(255,235,205,.28)'); cg.addColorStop(1, 'rgba(255,235,205,0)');
      g.fillStyle = cg; g.save(); g.translate(0, cy); g.scale(1, 0.35); g.fillRect(cx - cw, -cw, cw * 2, cw * 2); g.restore();
    }
    const sx = w * (0.22 + rnd() * 0.5), sg = g.createRadialGradient(sx, h * 0.55, 0, sx, h * 0.55, 120);
    sg.addColorStop(0, 'rgba(255,244,214,.95)'); sg.addColorStop(0.16, 'rgba(255,230,180,.6)'); sg.addColorStop(1, 'rgba(255,220,160,0)');
    g.fillStyle = sg; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(14,11,16,.94)';
    const kind = i % 4;
    if (kind === 0) {                            /* 山和楼阁 */
      g.beginPath(); g.moveTo(0, h * 0.74);
      for (let x = 0; x <= w; x += 32) g.lineTo(x, h * (0.64 + rnd() * 0.09));
      g.lineTo(w, h); g.lineTo(0, h); g.fill();
      const bx = w * (0.4 + rnd() * 0.25);
      for (let t = 0; t < 5; t++) { const tw = 170 - t * 28, ty = h * 0.68 - t * 40; g.beginPath(); g.moveTo(bx - tw / 2 - 14, ty + 12); g.quadraticCurveTo(bx, ty - 8, bx + tw / 2 + 14, ty + 12); g.lineTo(bx + tw / 2, ty + 14); g.lineTo(bx - tw / 2, ty + 14); g.fill(); g.fillRect(bx - tw / 2 + 16, ty + 14, tw - 32, 26); }
      g.fillRect(bx - 2, h * 0.68 - 200, 4, 30);
    } else if (kind === 1) {                     /* 天际线和灯 */
      for (let x = 0; x < w; x += 20 + rnd() * 28) { const bh = h * (0.1 + rnd() * 0.34); g.fillRect(x, h * 0.74 - bh, 16 + rnd() * 24, bh); }
      g.fillRect(0, h * 0.74, w, h);
      for (let k = 0; k < 160; k++) { g.fillStyle = `rgba(255,${190 + rnd() * 50},${110 + rnd() * 60},${0.5 + rnd() * 0.5})`; g.fillRect(rnd() * w, h * (0.44 + rnd() * 0.29), 2, 2 + rnd() * 2); }
    } else if (kind === 2) {                     /* 江面和桥 */
      g.fillRect(0, h * 0.72, w, h); g.fillRect(0, h * 0.6, w, 9); g.fillRect(0, h * 0.635, w, 4);
      for (let x = 30; x < w; x += 150) { g.fillRect(x, h * 0.44, 14, h * 0.28); g.fillRect(x - 6, h * 0.44, 26, 8); }
      g.strokeStyle = 'rgba(14,11,16,.94)'; g.lineWidth = 2;
      for (let x = 30; x < w; x += 15) { g.beginPath(); g.moveTo(x, h * 0.6); g.lineTo(x + 7, h * 0.635); g.lineTo(x + 15, h * 0.6); g.stroke(); }
    } else {                                     /* 街巷 */
      g.beginPath(); g.moveTo(0, h * 0.3); g.lineTo(w * 0.36, h * 0.58); g.lineTo(w * 0.36, h); g.lineTo(0, h); g.fill();
      g.beginPath(); g.moveTo(w, h * 0.24); g.lineTo(w * 0.62, h * 0.58); g.lineTo(w * 0.62, h); g.lineTo(w, h); g.fill();
      g.fillRect(0, h * 0.82, w, h);
      for (let k = 0; k < 26; k++) { g.fillStyle = `rgba(255,${180 + rnd() * 50},110,${0.5 + rnd() * 0.4})`; const left = rnd() > 0.5; g.fillRect(left ? rnd() * w * 0.32 : w * (0.66 + rnd() * 0.32), h * (0.42 + rnd() * 0.36), 8, 12); }
    }
    const water = g.createLinearGradient(0, h * 0.74, 0, h); water.addColorStop(0, 'rgba(255,200,140,.2)'); water.addColorStop(1, 'rgba(0,0,0,.55)');
    g.fillStyle = water; g.fillRect(0, h * 0.74, w, h * 0.26);
    const vg = g.createRadialGradient(w / 2, h / 2, w * 0.3, w / 2, h / 2, w * 0.75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)');
    g.fillStyle = vg; g.fillRect(0, 0, w, h);
    const d = g.getImageData(0, 0, w, h);          /* 胶片颗粒 */
    for (let p = 0; p < d.data.length; p += 4) { const n = (Math.random() - 0.5) * 26; d.data[p] += n; d.data[p + 1] += n; d.data[p + 2] += n; }
    g.putImageData(d, 0, 0);
    g.fillStyle = 'rgba(233,223,198,.5)'; g.font = '18px monospace'; g.fillText('示意图', 16, h - 16);
  });
}
const photos = SPOTS.map((_, i) => photo(i));

/* ---------- 材质 ---------- */
const M = {
  green: new THREE.MeshPhysicalMaterial({ color: 0x143026, roughness: 0.36, metalness: 0.1, clearcoat: 0.7, clearcoatRoughness: 0.28 }),
  greenDark: new THREE.MeshPhysicalMaterial({ color: 0x0e2019, roughness: 0.45, clearcoat: 0.4, clearcoatRoughness: 0.4 }),
  brass: new THREE.MeshStandardMaterial({ color: 0xd0a85c, roughness: 0.26, metalness: 1, roughnessMap: brushed, envMapIntensity: 2.2 }),
  brassDark: new THREE.MeshStandardMaterial({ color: 0x8a6830, roughness: 0.36, metalness: 1, roughnessMap: brushed, envMapIntensity: 1.8 }),
  black: new THREE.MeshStandardMaterial({ color: 0x100d0b, roughness: 0.75 }),
  felt: new THREE.MeshStandardMaterial({ color: 0x050404, roughness: 1 }),
  cherry: new THREE.MeshPhysicalMaterial({ color: 0xc4201a, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 2.5 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.04, metalness: 0, transparent: true, opacity: 0.05, envMapIntensity: 6 }),
};
const sh = m => { m.castShadow = true; m.receiveShadow = true; return m; };
const add = (parent, geo, mat, x, y, z) => { const m = sh(new THREE.Mesh(geo, mat)); m.position.set(x, y, z); parent.add(m); return m; };

/* ---------- 桌面和背后的墙 ---------- */
const table = new THREE.Mesh(new THREE.PlaneGeometry(70, 44),
  new THREE.MeshPhysicalMaterial({ map: woodTex, bumpMap: woodBump, bumpScale: 0.9, roughness: 0.42, metalness: 0, clearcoat: 0.35, clearcoatRoughness: 0.35 }));
table.rotation.x = -Math.PI / 2; table.receiveShadow = true; scene.add(table);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(70, 24), new THREE.MeshStandardMaterial({ color: 0x120504, roughness: 1 }));
wall.position.set(0, 12, -5.5); wall.receiveShadow = true; scene.add(wall);

/* 物件底下的接触阴影，让它们"坐"在桌上 */
const aoTex = tex(256, 256, (g, w, h) => { const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2); r.addColorStop(0, 'rgba(0,0,0,.85)'); r.addColorStop(0.55, 'rgba(0,0,0,.4)'); r.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0, 0, w, h); });
function contact(parent, w, d) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ map: aoTex, transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.012; parent.add(m); return m;
}

/* ---------- 胶卷罐 ---------- */
const CAN_X = -7.3;
const can = new THREE.Group(); can.position.set(CAN_X, 0, 0.35); scene.add(can);
contact(can, 4.6, 4.6);
const labelTex = tex(2048, 835, (g, w, h) => {   /* 画布比例 = 罐身周长 : 高度 */
  g.fillStyle = '#143026'; g.fillRect(0, 0, w, h);
  const x0 = w * 0.25;                            /* 这个位置转到正对镜头 */
  g.fillStyle = '#e9dfc6'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '600 250px "Songti SC","Noto Serif SC","STSong",serif';
  g.fillText('武', x0 - 40, h * 0.33); g.fillText('汉', x0 - 40, h * 0.67);
  g.save(); g.translate(x0 + 170, h * 0.5); g.rotate(Math.PI / 2);
  g.font = '34px "IBM Plex Mono",Menlo,monospace'; g.fillStyle = '#c9a45c';
  g.fillText(`ROLL 01 · WUHAN MEMORY · ${N} EXP`, 0, 0); g.restore();
  g.strokeStyle = '#c9a45c'; g.lineWidth = 3; g.strokeRect(x0 - 250, 40, 520, h - 80);
});
const canBody = add(can, new THREE.CylinderGeometry(1.25, 1.25, 3.1, 96),
  new THREE.MeshPhysicalMaterial({ map: labelTex, roughness: 0.36, metalness: 0.1, clearcoat: 0.7, clearcoatRoughness: 0.28 }), 0, 1.9, 0);
canBody.rotation.y = -Math.PI / 2;
add(can, new THREE.CylinderGeometry(1.36, 1.38, 0.3, 96), M.brassDark, 0, 0.15, 0);
add(can, new THREE.TorusGeometry(1.3, 0.05, 16, 96), M.brass, 0, 0.36, 0).rotation.x = Math.PI / 2;
add(can, new THREE.TorusGeometry(1.3, 0.05, 16, 96), M.brass, 0, 3.44, 0).rotation.x = Math.PI / 2;
add(can, new THREE.CylinderGeometry(1.38, 1.36, 0.32, 96), M.brassDark, 0, 3.62, 0);
add(can, new THREE.CylinderGeometry(1.2, 1.3, 0.06, 96), M.brass, 0, 3.81, 0);
const spool = add(can, new THREE.CylinderGeometry(0.3, 0.3, 0.7, 24), M.black, 0, 4.15, 0);
const spoolTop = add(can, new THREE.CylinderGeometry(0.34, 0.34, 0.1, 12), M.brass, 0, 4.55, 0);
add(can, new THREE.BoxGeometry(0.34, 2.8, 0.5), M.felt, 1.2, 1.9, -0.35);   /* 出片口的绒布 */

/* ---------- 胶片：略带起伏的一长条 ---------- */
const PITCH = 2.5, FW = 2.16, FH = 1.46, STRIP_H = 2.5, STRIP_Y = 1.9, STRIP_Z = -0.25, SLOT0 = -3.5;
const fz = x => STRIP_Z + 0.09 * Math.sin(x * 0.42 + 0.8);
const fry = x => -Math.atan(0.09 * 0.42 * Math.cos(x * 0.42 + 0.8));
const TILE = PITCH, STRIP_W = 50;
const stripTex = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#a84a24'; g.fillRect(0, 0, w, h);
  const sheen = g.createLinearGradient(0, 0, 0, h); sheen.addColorStop(0, 'rgba(255,170,110,.22)'); sheen.addColorStop(0.5, 'rgba(0,0,0,0)'); sheen.addColorStop(1, 'rgba(0,0,0,.25)');
  g.fillStyle = sheen; g.fillRect(0, 0, w, h);
  g.fillStyle = '#1c0705';
  for (let x = 17; x < w; x += 64) { for (const y of [30, h - 72]) { g.beginPath(); g.roundRect(x, y, 30, 42, 6); g.fill(); } }
  g.fillStyle = '#2a0c08'; g.beginPath(); g.roundRect(w * 0.5 - (FW / TILE) * w * 0.5 - 6, h * 0.5 - (FH / STRIP_H) * h * 0.5 - 6, (FW / TILE) * w + 12, (FH / STRIP_H) * h + 12, 6); g.fill();
  g.fillStyle = 'rgba(240,200,150,.75)'; g.font = '18px "IBM Plex Mono",monospace';
  g.fillText('WUHAN MEMORY', 150, 98); g.fillText('▸', w - 60, h - 82);
});
stripTex.wrapS = THREE.RepeatWrapping; stripTex.repeat.set(STRIP_W / TILE, 1);
const stripGeo = new THREE.PlaneGeometry(STRIP_W, STRIP_H, 200, 1);
const STRIP_LEFT = CAN_X + 1.2;
{ const p = stripGeo.attributes.position; for (let i = 0; i < p.count; i++) p.setZ(i, fz(p.getX(i) + STRIP_LEFT + STRIP_W / 2) - STRIP_Z); stripGeo.computeVertexNormals(); }
const strip = sh(new THREE.Mesh(stripGeo, new THREE.MeshPhysicalMaterial({ map: stripTex, roughness: 0.28, metalness: 0, clearcoat: 0.8, clearcoatRoughness: 0.2,
  side: THREE.DoubleSide, emissive: 0x3a1408, emissiveIntensity: 0.22 })));
strip.position.set(STRIP_LEFT + STRIP_W / 2, STRIP_Y, STRIP_Z); scene.add(strip);
contact(scene, 44, 1.6).position.set(STRIP_LEFT + 20, 0.012, STRIP_Z);

const frames = SPOTS.map((name, i) => {
  const mat = new THREE.MeshStandardMaterial({ map: photos[i], emissiveMap: photos[i], emissive: 0xffffff, emissiveIntensity: 0.2, roughness: 0.4, color: 0xff7755 });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(FW, FH), mat);
  m.userData = { i, name, lift: 0 };
  scene.add(m); return m;
});
/* 每格下方的格号，用很小的画布贴图 */
const numbers = SPOTS.map((_, i) => {
  const t = tex(128, 48, (g, w, h) => { g.fillStyle = 'rgba(240,200,150,.85)'; g.font = '30px "IBM Plex Mono",monospace'; g.textAlign = 'center'; g.fillText(pad(i + 1), w / 2, 34); });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.16), new THREE.MeshBasicMaterial({ map: t, transparent: true }));
  scene.add(m); return m;
});

/* ---------- 看片器：会沿着胶片滑到鼠标所指的那一格 ---------- */
const viewer = new THREE.Group(); viewer.position.set(SLOT0, 0, 0.75); scene.add(viewer);
const viewerAO = contact(viewer, 5.6, 3.6);
add(viewer, new RoundedBoxGeometry(3.7, 0.26, 1.9, 4, 0.08), M.greenDark, 0, 0.13, 0);
const box = add(viewer, new RoundedBoxGeometry(3.4, 3.7, 1.5, 10, 0.3), M.green, 0, 2.1, 0);
add(viewer, new RoundedBoxGeometry(2.7, 0.07, 1.0, 2, 0.03), M.brass, 0, 3.96, 0);
add(viewer, new THREE.TorusGeometry(0.5, 0.06, 16, 48, Math.PI), M.brass, 0, 3.98, 0);
for (const sx of [-1, 1]) add(viewer, new THREE.BoxGeometry(0.1, 2.7, 0.5), M.felt, sx * 1.71, STRIP_Y + 0.02, -0.9);  /* 两侧的过片缝 */
const frameOuter = add(viewer, new RoundedBoxGeometry(2.62, 2.62, 0.2, 6, 0.09), M.brass, 0, 2.42, 0.72);
add(viewer, new RoundedBoxGeometry(2.3, 2.3, 0.06, 4, 0.05), M.brassDark, 0, 2.42, 0.81);
const recess = new THREE.Mesh(new THREE.PlaneGeometry(2.16, 2.16), M.black); recess.position.set(0, 2.42, 0.842); viewer.add(recess);
const screenMat = new THREE.MeshStandardMaterial({ color: 0x000000, emissiveMap: photos[0], emissive: 0xffffff, emissiveIntensity: 1, roughness: 0.9 });
const screen = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 2.0), screenMat); screen.position.set(0, 2.42, 0.846); viewer.add(screen);
const glass = new THREE.Mesh(new THREE.PlaneGeometry(2.16, 2.16), M.glass); glass.position.set(0, 2.42, 0.86); viewer.add(glass);
for (const sx of [-1, 1]) for (const sy of [-1, 1]) {       /* 画框四角的螺丝 */
  const s = add(viewer, new THREE.CylinderGeometry(0.055, 0.055, 0.05, 16), M.brassDark, sx * 1.2, 2.42 + sy * 1.2, 0.83); s.rotation.x = Math.PI / 2;
}
const plateTex = tex(640, 128, () => {});
function drawPlate(name) {
  const c = plateTex.image, g = c.getContext('2d');
  const bg = g.createLinearGradient(0, 0, 0, c.height); bg.addColorStop(0, '#e2c27e'); bg.addColorStop(0.5, '#c9a45c'); bg.addColorStop(1, '#a8833f');
  g.fillStyle = bg; g.fillRect(0, 0, c.width, c.height);
  g.strokeStyle = '#6e5326'; g.lineWidth = 4; g.strokeRect(8, 8, c.width - 16, c.height - 16);
  g.fillStyle = '#6e5326'; for (const x of [22, c.width - 22]) { g.beginPath(); g.arc(x, c.height / 2, 6, 0, 7); g.fill(); }
  g.fillStyle = '#2a2420'; g.textAlign = 'center'; g.textBaseline = 'middle';
  let size = 54; g.font = `600 ${size}px "Songti SC","Noto Serif SC","STSong",serif`;
  while (g.measureText(name).width > c.width - 110 && size > 26) { size -= 2; g.font = `600 ${size}px "Songti SC","Noto Serif SC","STSong",serif`; }
  g.fillText(name, c.width / 2, c.height / 2 + 3);
  plateTex.needsUpdate = true;
}
const plate = new THREE.Mesh(new THREE.PlaneGeometry(1.9, 0.38), new THREE.MeshStandardMaterial({ map: plateTex, roughness: 0.32, metalness: 0.85, envMapIntensity: 1.6 }));
plate.position.set(0, 0.72, 0.752); viewer.add(plate);
const arm = add(viewer, new THREE.CylinderGeometry(0.06, 0.06, 0.5, 16), M.brassDark, 1.92, 3.0, 0.1); arm.rotation.z = Math.PI / 2;
const knob = add(viewer, new THREE.SphereGeometry(0.27, 48, 32), M.cherry, 2.2, 3.0, 0.1);
viewer.userData.hover = 0;

/* ---------- 状态 ---------- */
let sel = 0, group = 0, filmX = 0, entered = false, wheelAcc = 0, wheelLock = 0, shownTitle = -1;
const filmTarget = () => group * G * PITCH;
const slotX = i => SLOT0 + i * PITCH - filmX;
const mouse = new THREE.Vector2(0, 0), ray = new THREE.Raycaster(), ndc = new THREE.Vector2(9, 9);
let hovered = null;
const $ = id => document.getElementById(id);
const ticks = SPOTS.map(() => { const i = document.createElement('i'); $('ticks').appendChild(i); return i; });

function setTitle(i) {
  if (i === shownTitle) return; shownTitle = i;
  $('no').textContent = `第 ${pad(i + 1)} 格 / ${pad(N)}`;
  const el = $('title'); el.className = 'out';
  setTimeout(() => { el.textContent = SPOTS[shownTitle]; el.className = 'in'; requestAnimationFrame(() => requestAnimationFrame(() => { el.className = ''; })); }, 180);
}
function select(i) {
  i = THREE.MathUtils.clamp(i, 0, N - 1);
  group = Math.floor(i / G);
  if (i !== sel || shownTitle < 0) {
    sel = i;
    screenMat.emissiveMap = photos[i]; screenMat.needsUpdate = true; screenMat.emissiveIntensity = 0.04;
    drawPlate(SPOTS[i]);
  }
  setTitle(i);
  const a = group * G, b = Math.min(N, a + G);
  $('range').innerHTML = `<b>${pad(a + 1)} — ${pad(b)}</b> / ${pad(N)}`;
  ticks.forEach((t, k) => { t.className = k === sel ? 'sel' : (k >= a && k < b ? 'grp' : ''); });
  $('prev').disabled = group === 0; $('next').disabled = group === GROUPS - 1;
}
function page(dir) { const g2 = THREE.MathUtils.clamp(group + dir, 0, GROUPS - 1); if (g2 !== group) select(Math.min(N - 1, g2 * G + (sel % G))); }
$('prev').addEventListener('click', e => { e.stopPropagation(); page(-1); });
$('next').addEventListener('click', e => { e.stopPropagation(); page(1); });

addEventListener('wheel', e => {
  if (entered) return;
  const now = performance.now(); if (now < wheelLock) return;
  wheelAcc += e.deltaY + e.deltaX;
  if (Math.abs(wheelAcc) > 50) { select(sel + Math.sign(wheelAcc)); wheelAcc = 0; wheelLock = now + 260; }
}, { passive: true });
addEventListener('keydown', e => {
  if (e.key === 'Escape' && entered) return leave();
  if (entered) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') select(sel + 1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') select(sel - 1);
  if (e.key === 'PageDown') page(1);
  if (e.key === 'PageUp') page(-1);
  if (e.key === 'Enter') enter();
});
addEventListener('pointermove', e => {
  mouse.set((e.clientX / innerWidth) * 2 - 1, (e.clientY / innerHeight) * 2 - 1);
  ndc.set(mouse.x, -mouse.y);
});
function enter() { entered = true; document.body.classList.add('entered'); $('enterName').textContent = SPOTS[sel]; $('back').textContent = '← 回到胶卷'; }
function leave() { entered = false; document.body.classList.remove('entered'); $('back').textContent = '← 回到桌面'; }
renderer.domElement.addEventListener('click', () => {
  if (entered) return leave();
  if (!hovered) return;
  if (hovered !== viewer) select(hovered.userData.i);
  enter();
});
$('back').style.cursor = 'pointer'; $('back').addEventListener('click', () => { if (entered) leave(); });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); CAM.z = camZ();
});

/* ---------- 每一帧 ---------- */
const clock = new THREE.Clock();
const damp = (cur, to, speed, dt) => cur + (to - cur) * (1 - Math.exp(-speed * dt));
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const prevFilm = filmX;
  filmX = damp(filmX, filmTarget(), 4.2, dt);
  const speed = Math.abs(filmX - prevFilm) / Math.max(dt, 0.001);

  /* 鼠标指着哪一格：看片器就滑到那一格 */
  hovered = null;
  if (!entered) {
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects([...frames.filter(f => f.visible), box, frameOuter, screen, glass], false)[0];
    hovered = !hit ? null : (hit.object.userData.name ? hit.object : viewer);
    if (hovered && hovered !== viewer) {
      const i = hovered.userData.i;
      if (Math.floor(i / G) === group && speed < 1.5) select(i);
    }
  }
  renderer.domElement.style.cursor = hovered ? 'pointer' : 'default';

  frames.forEach((f, idx) => {
    const x = slotX(f.userData.i);
    f.visible = x > CAN_X + 1.5 && x < 16;
    numbers[idx].visible = f.visible;
    const nextGroupHover = hovered === f && Math.floor(f.userData.i / G) !== group;
    f.userData.lift = damp(f.userData.lift, nextGroupHover ? 1 : 0, 9, dt);
    const L = f.userData.lift, isSel = f.userData.i === sel;
    f.position.set(x, STRIP_Y + L * 0.1, fz(x) + 0.012 + L * 0.4);
    f.rotation.y = fry(x); f.scale.setScalar(1 + L * 0.12);
    const lit = Math.max(L, isSel ? 1 : 0);
    f.material.color.setRGB(1, 0.47 + lit * 0.53, 0.33 + lit * 0.67);
    f.material.emissiveIntensity = 0.2 + L * 0.5;
    numbers[idx].position.set(x - FW / 2 + 0.24, STRIP_Y - FH / 2 - 0.16, fz(x) + 0.014); numbers[idx].rotation.y = fry(x);
  });
  stripTex.offset.x = (filmX - (SLOT0 - STRIP_LEFT)) / TILE + 0.5;   /* 让底片上的画格位置和照片对齐 */

  /* 看片器滑动、倾斜，旋钮和罐轴跟着转 */
  const vx = SLOT0 + sel * PITCH - filmTarget();
  const prevVx = viewer.position.x;
  viewer.position.x = damp(viewer.position.x, vx, 6.5, dt);
  const vSpeed = (viewer.position.x - prevVx) / Math.max(dt, 0.001);
  viewer.userData.hover = damp(viewer.userData.hover, hovered === viewer ? 1 : 0, 8, dt);
  const H = viewer.userData.hover;
  viewer.rotation.z = THREE.MathUtils.clamp(-vSpeed * 0.004, -0.04, 0.04);      /* 滑动时带一点惯性倾斜 */
  viewer.rotation.x = -H * 0.025; viewer.position.z = 0.75 + H * 0.18;
  viewerAO.material.opacity = 1 - H * 0.2;
  screen.scale.setScalar(1 + H * 0.03);
  screenMat.emissiveIntensity = damp(screenMat.emissiveIntensity, 1.0, 3.2, dt);
  knob.rotation.x += vSpeed * dt * 0.8; arm.rotation.x += vSpeed * dt * 0.8;
  spool.rotation.y = spoolTop.rotation.y = -filmX * 0.9;

  /* 镜头：平时轻微跟随鼠标；点击后推近到看片器 */
  if (entered) { camPos.set(viewer.position.x, 2.6, 9.6); camLook.set(viewer.position.x, 2.2, 0.8); }
  else { camPos.set(CAM.x + mouse.x * 0.6, CAM.y - mouse.y * 0.32, CAM.z); camLook.copy(LOOK); }
  const cs = entered ? 2.4 : 3.2;
  camera.position.set(damp(camera.position.x, camPos.x, cs, dt), damp(camera.position.y, camPos.y, cs, dt), damp(camera.position.z, camPos.z, cs, dt));
  lookNow.set(damp(lookNow.x, camLook.x, cs, dt), damp(lookNow.y, camLook.y, cs, dt), damp(lookNow.z, camLook.z, cs, dt));
  camera.lookAt(lookNow);
  lamp.position.x = damp(lamp.position.x, -3 + mouse.x * 2.4, 2, dt);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
select(0);
frame();
</script>
</body>
</html>
